project:
  title: 7-Segment Counter
  author: Khoa
  discord: ''
  description: 'BCD counter 0-9 on the onboard 7-segment display: 4 switchable counting speeds, up/down direction, pause with dp indicator. Clock 50MHz.'
  language: Verilog
  clock_hz: 50000000
  tiles: 1x1
  top_module: tt_um_kouskos56_seg7
  source_files:
  - tt_um_kouskos56_seg7.v
pinout:
  ui[0]: 'Speed select bit 0 (00=slowest ~3Hz, 11=fastest ~190Hz)'
  ui[1]: 'Speed select bit 1'
  ui[2]: 'Direction (0=down, 1=up)'
  ui[3]: 'Pause (1=hold count, dp lights)'
  ui[4]: ''
  ui[5]: ''
  ui[6]: ''
  ui[7]: ''
  uo[0]: '7-seg segment a'
  uo[1]: '7-seg segment b'
  uo[2]: '7-seg segment c'
  uo[3]: '7-seg segment d'
  uo[4]: '7-seg segment e'
  uo[5]: '7-seg segment f'
  uo[6]: '7-seg segment g'
  uo[7]: 'Decimal point (pause indicator)'
  uio[0]: ''
  uio[1]: ''
  uio[2]: ''
  uio[3]: ''
  uio[4]: ''
  uio[5]: ''
  uio[6]: ''
  uio[7]: ''
